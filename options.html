<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Netflix 实时中文字幕设置</title>
  <link rel="stylesheet" href="ui.css">
</head>
<body>
  <main>
    <h1>Netflix 实时中文字幕</h1>
    <p class="hint">使用本机 llama.cpp 与 Hy-MT2 Q4_K_M 翻译 Netflix 字幕。</p>
    <div class="row">
      <label>源语言<input id="source" value="auto" placeholder="自动识别填 auto"></label>
      <label>目标语言<input id="target" value="zh"></label>
      <label>中文字幕字号<input id="fontSize" type="number" min="16" max="60"></label>
      <label>参考前文条数<input id="contextLines" type="number" min="0" max="8"></label>
    </div>
    <label class="check"><input id="bilingual" type="checkbox"> 在翻译框内复制英文原文（Netflix 原字幕仍会保留）</label>
    <button id="save">保存设置</button>
    <span id="status"></span>
    <section>
      <h2>启动本机翻译服务</h2>
      <code>llama.exe serve -hf tencent/Hy-MT2-1.8B-GGUF:Q4_K_M -ngl all -c 2048 -np 1 -a hy-mt2-fast</code>
      <p class="hint">首次运行会下载模型。保持该窗口开启后，刷新 Netflix 播放页面即可。</p>
    </section>
  </main>
  <script src="options.js"></script>
</body>
</html>
