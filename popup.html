<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="ui.css">
</head>
<body class="popup">
  <h2>本地 AI 实时字幕翻译</h2>
  <div class="status-card">
    <div class="status-header">
      <span class="status-dot checking" id="statusDot"></span>
      <span class="status-title" id="statusTitle">正在检测服务状态...</span>
    </div>
    <div class="status-desc" id="statusDesc">目标地址: 127.0.0.1:8080</div>
  </div>
  <label>语言 / Language<select id="uiLanguage"><option value="zh">中文</option><option value="en">English</option></select></label>
  <label>目标语言<select id="target"><option value="zh">简体中文</option><option value="en">英语</option><option value="ja">日语</option><option value="ko">韩语</option><option value="fr">法语</option><option value="de">德语</option><option value="es">西班牙语</option></select></label>
  <label class="check"><input id="enabled" type="checkbox"> 启用实时翻译</label>
  <label class="check"><input id="webSelectionEnabled" type="checkbox"> 启用网页划词翻译</label>
  <label class="check"><input id="webAutoTranslateEnabled" type="checkbox"> 启用网页双语翻译（自动）</label>
  <p class="hint">支持视频暂停查词、网页划词查词/翻译（点击“译”图标或右键菜单）及整页双语翻译。</p>
  <div class="popup-actions">
    <button id="togglePageTranslate" type="button" class="secondary-btn">双语翻译当前网页</button>
    <button id="openPdfViewer" type="button" class="secondary-btn">打开 PDF 论文阅读器</button>
    <button id="options" type="button">翻译服务设置</button>
  </div>
  <script src="i18n.js"></script><script src="popup.js"></script>
</body>
</html>
